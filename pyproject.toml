[project]
name = "aurora-ict"
version = "0.1.0"
description = "Aurora-ICT — ICT (Inner Circle Trader) 기반 자동매매 봇. Smart Money Concepts (FVG / Liquidity Sweep / MSS / Silver Bullet)."
authors = [{name = "Aurora-ICT Team"}]
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # 2026-05-30 상한 핀: ccxt latest 가 build 마다 install 되며 Bybit demo
    # enableDemoTrading 후 place_order 가 'Permission denied' (retCode 10005)
    # 반환하는 회귀 발견. 직전 안정 라인 (4.4.x) 안에서만 install 되도록 상한.
    "ccxt>=4.4.0,<4.5.0",
    "pandas>=2.2.0,<3.0",
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pywebview>=5.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
build = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
