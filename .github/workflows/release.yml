name: Release

# tag push 시 Windows + macOS 동시 빌드 → GitHub Release 자동 첨부.
#
# 코드 repo (Aurora-ICT) 는 private. release artifact 는 별도 public repo
# (Aurora-ICT-releases) 로 push — RELEASES_REPO_TOKEN secret = fine-grained PAT
# (Contents: write 권한 on Aurora-ICT-releases).
#
# secret 박혀있지 않을 때는 같은 repo 자체 release 로 fallback.
#
# 사용법:
#   git tag v0.3.1 && git push origin v0.3.1
#   → ~10분 후 release 에 자동 첨부:
#     · Aurora-ICT-windows.exe
#     · Aurora-ICT-macOS.zip
#     · Aurora-ICT-macOS.dmg
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (예: v0.3.1)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: Aurora-ICT-windows.exe
            artifact_path: dist/Aurora-ICT-windows.exe
            artifact_name: aurora-ict-windows
          - os: macos-14
            asset_name: Aurora-ICT-macOS.zip
            artifact_path: dist/Aurora-ICT-macOS.zip
            artifact_name: aurora-ict-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump __version__ from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF##*/v}"
          echo "Bumping __version__ to $VERSION"
          for f in src/aurora_ict/__init__.py src/aurora_ict_launcher/__init__.py; do
              if [ -f "$f" ]; then
                  sed -i.bak 's/__version__ = ".*"/__version__ = "'"$VERSION"'"/' "$f"
                  rm -f "$f.bak"
                  echo "--- $f ---"
                  cat "$f"
              fi
          done

      - name: Setup Python 3.11
        id: setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          PY="${{ steps.setup.outputs.python-path }}"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r requirements-dev.txt
          "$PY" -m pip install pyinstaller
          "$PY" -m pip install -e .

      - name: Remove aiodns
        shell: bash
        run: |
          "${{ steps.setup.outputs.python-path }}" -m pip uninstall -y aiodns
        continue-on-error: true

      - name: Build (PyInstaller spec)
        shell: bash
        run: |
          PY="${{ steps.setup.outputs.python-path }}"
          "$PY" -m PyInstaller Aurora-ICT.spec --clean --noconfirm

      - name: Verify Windows artifact
        if: matrix.os == 'windows-latest'
        run: |
          if (-not (Test-Path "dist/Aurora-ICT.exe")) {
              Write-Error "dist/Aurora-ICT.exe missing"
              Get-ChildItem dist
              exit 1
          }
          $size = (Get-Item "dist/Aurora-ICT.exe").Length / 1MB
          Write-Host "Aurora-ICT.exe size: $([math]::Round($size, 1)) MB"
          # 사이트 다운로드 링크와 일치하도록 rename (Aurora-ICT-windows.exe)
          Move-Item -Path "dist/Aurora-ICT.exe" -Destination "dist/Aurora-ICT-windows.exe" -Force
        shell: pwsh

      - name: ad-hoc codesign macOS .app
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          if [ -d "dist/Aurora-ICT.app" ]; then
              codesign --force --deep --sign - dist/Aurora-ICT.app
              codesign --verify --verbose=2 dist/Aurora-ICT.app || echo "verify warning"
          fi

      - name: Zip macOS .app
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          if [ ! -d "dist/Aurora-ICT.app" ]; then
              echo "macOS artifact missing"
              ls -la dist/
              exit 1
          fi
          cd dist
          zip -r -y Aurora-ICT-macOS.zip Aurora-ICT.app
          echo "Aurora-ICT-macOS.zip size: $(du -h Aurora-ICT-macOS.zip | cut -f1)"

      - name: Build macOS DMG
        if: matrix.os == 'macos-14' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          hdiutil create -volname "Aurora-ICT" \
            -srcfolder Aurora-ICT.app \
            -ov -format UDZO \
            Aurora-ICT-macOS.dmg
          echo "Aurora-ICT-macOS.dmg size: $(du -h Aurora-ICT-macOS.dmg | cut -f1)"

      # external repo (Aurora-ICT-releases) — RELEASES_REPO_TOKEN 박혀있을 때
      - name: Attach Windows .exe (external repo)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v') && env.RELEASES_TOKEN != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          target_commitish: main
          files: dist/Aurora-ICT-windows.exe
          generate_release_notes: false
          body: |
            Aurora-ICT ${{ github.ref_name }} release.

            Code repo (private): https://github.com/WL131231/Aurora-ICT
          repository: WL131231/Aurora-ICT-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}

      - name: Attach macOS files (external repo)
        if: matrix.os == 'macos-14' && startsWith(github.ref, 'refs/tags/v') && env.RELEASES_TOKEN != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          target_commitish: main
          files: |
            dist/Aurora-ICT-macOS.zip
            dist/Aurora-ICT-macOS.dmg
          generate_release_notes: false
          body: |
            Aurora-ICT ${{ github.ref_name }} release.

            Code repo (private): https://github.com/WL131231/Aurora-ICT
          repository: WL131231/Aurora-ICT-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}

      # self repo (Aurora-ICT) — secret 박혀있지 않을 때 fallback
      - name: Attach Windows .exe (self)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v') && env.RELEASES_TOKEN == ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Aurora-ICT-windows.exe
          generate_release_notes: true

      - name: Attach macOS files (self)
        if: matrix.os == 'macos-14' && startsWith(github.ref, 'refs/tags/v') && env.RELEASES_TOKEN == ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Aurora-ICT-macOS.zip
            dist/Aurora-ICT-macOS.dmg
          generate_release_notes: true

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
