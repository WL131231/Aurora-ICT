<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AURORA · ICT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  /* AURORA · ICT — Monochrome (사이트 팔레트와 동일)
     #141316 base · #1C1C1C bg-2 · #201F1F surface · #DBDBDE text/accent */
  :root {
    --bg:       #141316;
    --bg-2:     #1C1C1C;
    --surface:  #201F1F;
    --text-1:   #DBDBDE;
    --text-2:   #8b8b90;
    --text-3:   #5a5a60;
    --accent:   #DBDBDE;
    --accent-2: #ffffff;
    --line:     rgba(219, 219, 222, 0.08);
    --line-strong: rgba(219, 219, 222, 0.16);
    /* 차트 의미색은 그대로 유지 (long=green / short=red / sweep=amber 등) */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-1);
    font-family: 'JetBrains Mono', system-ui, sans-serif;
    font-size: 13px;
  }
  .wrap { display: flex; height: 100vh; }
  .sidebar {
    width: 260px;
    background: var(--bg-2);
    border-right: 1px solid var(--line);
    padding: 20px;
    overflow-y: auto;
  }
  .sidebar h1 {
    font-size: 12px;
    letter-spacing: 0.3em;
    font-weight: 400;
    margin: 0 0 24px 0;
    color: var(--accent);
  }
  .sidebar h2 {
    font-size: 10px;
    letter-spacing: 0.25em;
    font-weight: 400;
    color: var(--text-3);
    margin: 20px 0 8px 0;
    text-transform: uppercase;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 11px;
  }
  .row .k { color: var(--text-2); }
  .row .v { color: var(--text-1); font-weight: 500; }
  .v.long { color: #34d399; }
  .v.short { color: #fb7185; }
  .v.demo { color: #fbbf24; }
  .v.live { color: #fb7185; }
  .v.running { color: #34d399; }
  .v.stopped { color: var(--text-3); }
  button {
    width: 100%;
    padding: 9px 12px;
    margin: 4px 0;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text-1);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.18s, border-color 0.18s, color 0.18s;
  }
  button:hover {
    background: rgba(219, 219, 222, 0.06);
    border-color: var(--line-strong);
  }
  button.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  button.danger {
    background: var(--surface);
    border-color: var(--line);
    color: var(--text-2);
  }
  button.danger:hover {
    background: rgba(251, 113, 133, 0.08);
    border-color: rgba(251, 113, 133, 0.35);
    color: #fb7185;
  }
  .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
  .chart-wrap {
    flex: 1;
    position: relative;
  }
  #chart { width: 100%; height: 100%; }
  .legend {
    padding: 10px 18px;
    background: var(--bg-2);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-2);
    border-top: 1px solid var(--line);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .legend span::before {
    content: "■ ";
    margin-right: 4px;
  }
  /* 차트 의미 색은 일관성 유지 (long=green / short=red / sweep=amber / structure=blue/violet) */
  .leg-bull-fvg::before    { color: rgba(52, 211, 153, 0.6); }
  .leg-bear-fvg::before    { color: rgba(251, 113, 133, 0.6); }
  .leg-sweep::before       { color: #fbbf24; }
  .leg-bos::before         { color: #60a5fa; }
  .leg-choch::before       { color: #c084fc; }
  .leg-kz::before          { color: rgba(219, 219, 222, 0.25); }
  .leg-sb::before          { color: rgba(251, 191, 36, 0.5); }
  .leg-setup-long::before  { color: #34d399; }
  .leg-setup-short::before { color: #fb7185; }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 16px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    color: var(--text-1);
    border-radius: 4px;
    font-size: 11px;
    letter-spacing: 0.1em;
    display: none;
  }
  .toast.error {
    background: rgba(251, 113, 133, 0.10);
    border-color: rgba(251, 113, 133, 0.40);
    color: #fb7185;
  }
</style>
</head>
<body>
<div class="wrap">
  <aside class="sidebar">
    <h1>AURORA · ICT</h1>

    <h2>Status</h2>
    <div class="row"><span class="k">State</span><span id="s-state" class="v">—</span></div>
    <div class="row"><span class="k">Mode</span><span id="s-mode" class="v">—</span></div>
    <div class="row"><span class="k">Enabled</span><span id="s-enabled" class="v">—</span></div>
    <div class="row"><span class="k">Symbol</span><span id="s-symbol" class="v">—</span></div>
    <div class="row"><span class="k">Credentials</span><span id="s-creds" class="v">—</span></div>
    <div class="row"><span class="k">Active Position</span><span id="s-pos" class="v">—</span></div>

    <h2>Mode</h2>
    <button id="btn-demo" class="active">DEMO</button>
    <button id="btn-live" class="danger">LIVE</button>

    <h2>Control</h2>
    <button id="btn-start">START</button>
    <button id="btn-stop" class="danger">STOP</button>

    <h2>Marker Counts</h2>
    <div class="row"><span class="k">FVG</span><span id="c-fvgs" class="v">0</span></div>
    <div class="row"><span class="k">Sweep</span><span id="c-sweeps" class="v">0</span></div>
    <div class="row"><span class="k">MSS / BOS</span><span id="c-struct" class="v">0</span></div>
    <div class="row"><span class="k">Swing</span><span id="c-swings" class="v">0</span></div>
    <div class="row"><span class="k">Killzone</span><span id="c-kz" class="v">0</span></div>
    <div class="row"><span class="k">Setup</span><span id="c-setups" class="v">0</span></div>
  </aside>

  <main class="main">
    <div class="chart-wrap"><div id="chart"></div></div>
    <div class="legend">
      <span class="leg-bull-fvg">Bullish FVG</span>
      <span class="leg-bear-fvg">Bearish FVG</span>
      <span class="leg-sweep">Liquidity Sweep</span>
      <span class="leg-bos">BOS</span>
      <span class="leg-choch">CHoCH (MSS)</span>
      <span class="leg-kz">Killzone</span>
      <span class="leg-sb">Silver Bullet</span>
      <span class="leg-setup-long">Long Setup</span>
      <span class="leg-setup-short">Short Setup</span>
    </div>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
