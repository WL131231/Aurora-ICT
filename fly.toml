# Aurora-ICT SaaS — Fly.io 배포 설정
#
# 첫 배포:
#   fly launch --copy-config --no-deploy   # 앱 이름/리전 확정
#   fly volumes create aurora_data --region nrt --size 1
#   fly secrets set AURORA_ICT_MASTER_KEY="$(python -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')"
#   fly deploy
#
# 도메인 + HTTPS 는 Fly 가 LetsEncrypt 로 자동 발급 (force_https=true).

app = "aurora-ict-one"
primary_region = "sin"

[build]
  # Dockerfile 사용 — 별도 builder 지정 X.

[env]
  AURORA_ICT_HOST = "0.0.0.0"
  AURORA_ICT_PORT = "8765"
  AURORA_ICT_DATA_DIR = "/data"
  AURORA_ICT_SECURE_COOKIE = "1"
  AURORA_ICT_SAAS = "1"

[[mounts]]
  source = "aurora_data"
  destination = "/data"

[[services]]
  internal_port = 8765
  protocol = "tcp"
  # 거래 봇 — 항상 켜져 있어야 함 (포지션 모니터링).
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [services.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    # 봇 step 의 동기 indicator 계산(swing/fvg/ob/sweep + HTF FVG map, 2심볼)이
    # asyncio 이벤트루프를 잠깐 블록 → /ict/health(초경량)조차 응답이 밀린다.
    # timeout 5s 는 그 부하엔 빡빡해 Fly 가 unhealthy 오판 → 머신 replacing 반복.
    # 봇 매매는 정상이므로 timeout/grace 를 늘려 과민반응만 완화한다.
    # (근본 해결 = step CPU 작업을 run_in_executor 로 빼는 것 — 별도 작업)
    interval = "30s"
    timeout = "20s"
    grace_period = "45s"
    method = "get"
    path = "/ict/health"
    protocol = "http"

# 2026-06-06: 베타 테스터 11명 추가 → 멀티유저 봇(사용자별 페어 × OHLCV 캐시 +
# step detect)의 메모리·CPU 부하 대비 증설. shared-cpu-4x(CPU 4) + 4GB.
# 2026-06-12: 고정7 구도로 사용자당 봇 인스턴스 7~10개 (기존 1~5) — 간헐 다운
# 보고에 따라 한 단계 증설 (4x/4GB → 8x/8GB). 부하 모니터링 후 조정.
[[vm]]
  size = "shared-cpu-8x"
  memory = "8gb"
