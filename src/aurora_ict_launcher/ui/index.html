<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora · ICT Launcher</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- 검은 배경 + ICT painterly 손 (사용자 페이지 동일 분위기) -->
    <div class="bg-gradient"></div>
    <div class="bg-texture"></div>
    <div class="bg-hands"></div>

    <!-- v0.4.66 (G-2b): 라이선스 게이트 화면 — license.json 없거나 verify fail 시 보임 -->
    <section id="license-gate" class="license-gate" style="display:none">
        <div class="license-gate-inner">
            <div class="brand-row">
                <div class="logo-mark">
                    <svg width="40" height="40" viewBox="0 0 28 28" fill="none">
                        <defs>
                            <linearGradient id="logoGradGate" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#DBDBDE" />
                                <stop offset="100%" stop-color="#8b8b90" />
                            </linearGradient>
                        </defs>
                        <path d="M14 2 L26 14 L14 26 L2 14 Z" stroke="url(#logoGradGate)" stroke-width="1.5" fill="none" />
                        <path d="M14 8 L20 14 L14 20 L8 14 Z" fill="url(#logoGradGate)" opacity="0.6" />
                    </svg>
                </div>
                <span class="brand-text">AURORA · ICT</span>
            </div>

            <h2 class="license-title">라이선스 코드를 입력해주세요</h2>
            <p class="license-sub">관리자에게 발급받은 16자리 코드를 입력하면 봇이 활성화됩니다.</p>

            <div class="license-form">
                <input id="license-code-input"
                       type="text"
                       placeholder="AICT-XXXX-XXXX-XXXX"
                       autocomplete="off"
                       spellcheck="false"
                       maxlength="19" />
                <button id="license-submit-btn" class="btn-license">등록</button>
            </div>

            <div id="license-message" class="license-message"></div>

            <p class="license-footnote">
                코드는 PC 1대에 묶입니다. 다른 PC 에서 사용하려면 관리자에게 재발급을 요청하세요.
            </p>
        </div>
    </section>

    <main id="main-screen" class="cinematic" style="display:none">
        <!-- 우측 상단 끝 버전 표시 (창 전체 기준 absolute) -->
        <div class="global-version">
            <span id="version-info">v—</span>
        </div>

        <!-- 좌측 — 브랜드 / 로그 / (하단) status·progress -->
        <section class="hero">
            <div class="hero-top">
                <div class="brand-row">
                    <div class="logo-mark">
                        <svg width="40" height="40" viewBox="0 0 28 28" fill="none">
                            <defs>
                                <linearGradient id="logoGradHero" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#DBDBDE" />
                                    <stop offset="100%" stop-color="#8b8b90" />
                                </linearGradient>
                            </defs>
                            <path d="M14 2 L26 14 L14 26 L2 14 Z" stroke="url(#logoGradHero)" stroke-width="1.5" fill="none" />
                            <path d="M14 8 L20 14 L14 20 L8 14 Z" fill="url(#logoGradHero)" opacity="0.6" />
                        </svg>
                    </div>
                    <span class="brand-text">AURORA · ICT</span>
                </div>
            </div>

            <div class="hero-bottom">
                <div class="log-area">
                    <ul id="log-list"></ul>
                </div>
                <!-- v0.4.70: status·progress 가 hero 하단 (로그 아래) 로 이동 -->
                <div class="hero-status">
                    <div id="status-line"></div>
                    <div id="progress-container" class="progress-container" style="display:none">
                        <div id="progress-bar" class="progress-bar"></div>
                        <div id="progress-text" class="progress-text"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 우측 — 라이선스 배지 + Start 버튼 -->
        <aside class="visual">
            <div class="diamond-stage">
                <svg viewBox="0 0 400 400" class="diamond-hero">
                    <defs>
                        <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#DBDBDE" />
                            <stop offset="100%" stop-color="#5a5a60" />
                        </linearGradient>
                        <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="rgba(219, 219, 222, 0.25)" />
                            <stop offset="100%" stop-color="rgba(219, 219, 222, 0)" />
                        </radialGradient>
                    </defs>
                    <circle cx="200" cy="200" r="180" fill="url(#heroGlow)" />
                    <path d="M200 40 L360 200 L200 360 L40 200 Z"
                          stroke="url(#heroGrad)" stroke-width="3" fill="none"
                          opacity="0.95" />
                    <path d="M200 90 L310 200 L200 310 L90 200 Z"
                          stroke="url(#heroGrad)" stroke-width="2" fill="none"
                          opacity="0.5" />
                    <path d="M200 130 L270 200 L200 270 L130 200 Z"
                          fill="url(#heroGrad)" opacity="0.7" />
                </svg>
            </div>

            <!-- v0.4.70: 라이선스 배지 (Start 버튼 상단) + 코드 재입력 버튼 -->
            <div class="license-bar" style="display:none">
                <div id="license-badge" class="license-badge"></div>
                <button id="btn-relicense" class="btn-relicense" title="코드 다시 입력">코드 재입력</button>
            </div>

            <button id="btn-start" class="btn-start">
                <span class="btn-arrow">▶</span>
                <span class="btn-label">Trading Start</span>
            </button>
        </aside>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
